<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>보험금 청구서 자동기입 (links.json 연동)</title>
<meta name="format-detection" content="telephone=no" />
<style>
  :root{--bg:#f6f8fb;--card:#fff;--ink:#111827;--muted:#6b7280;--brand:#3a64ff;--line:#e5e7eb;--radius:16px;--shadow:0 10px 30px rgba(17,24,39,.08)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Apple SD Gothic Neo,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:900px;margin:24px auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;transition:border-color .2s, box-shadow .2s}
  input:focus, select:focus {border-color:var(--brand);box-shadow:0 0 0 3px rgba(58,100,255,.2);outline:none}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;transition:all .2s}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.05)}
  .btn.primary:hover:not(:disabled){box-shadow:0 4px 12px rgba(58,100,255,.2)}
  .btn:disabled{background:#f6f8fb;color:var(--muted);border-color:var(--line);cursor:not-allowed;opacity:0.7}
  .muted{color:var(--muted);font-size:12px}
  h2{margin:0 0 12px 0}
  h3{margin:0 0 16px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:grid;gap:0;align-items:center}
  .seg-rrn{grid-template-columns:1fr 14px 1fr}
  .seg-phone{grid-template-columns:72px 14px 84px 14px 84px}
  .seg input{text-align:center;letter-spacing:1px}
  .dash{color:var(--muted);text-align:center}
  
  /* (MODIFIED) 주소 라인 스타일 수정 */
  .addr-line{display:grid;grid-template-columns:100px 1fr;gap:8px;}
  input[readonly]#addr {cursor: pointer;} /* (NEW) 도로명주소 클릭 커서 */

  .check-group {display:flex;flex-wrap:wrap;gap:10px}
  .check-group label {display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .2s}
  .check-group input[type="radio"], .check-group input[type="checkbox"] {width:auto;accent-color:var(--brand);}
  .check-group label:has(:checked) {background:rgba(58,100,255,.05);border-color:var(--brand);box-shadow:0 0 0 2px rgba(58,100,255,.1)}
  .data-actions{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .data-actions input {width:240px}
  .step-nav {display:grid;grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px;margin-bottom:12px}
  .step-nav-item {flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-size:14px;font-weight:600; cursor: pointer; transition: background .2s, color .2s;}
  .step-nav-item:hover {background: #eef2ff; color: var(--brand);}
  .step-nav-item.active {background:var(--brand);color:#fff;border-color:var(--brand); cursor: default;}
  .step-nav-item.active:hover {background: var(--brand); color: #fff;}
  .step {display:none}
  .step.active {display:block}
  .step-footer {margin-top:20px;display:flex;justify-content:space-between;align-items:center}
  
  .carrier-type-heading {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin: 24px 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .carrier-type-heading:first-of-type {
    margin-top: 0;
  }
  .carrier-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .carrier-item { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .carrier-item label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; gap: 6px; height: 100%; cursor: pointer; }
  .carrier-item img {
    width: 100%;
    height: 60px; /* 높이를 50px에서 60px로 수정 */
    /* max-width: 100px; */ /* 최대 너비 제한 제거 */
    object-fit: contain;
    border-radius: 8px;
  }
  .carrier-item span { font-size: 14px; font-weight: 600; color: var(--ink); text-align: center; }
  .carrier-item input[type="checkbox"] { display:none; }
  .carrier-item label:has(:checked) { background:rgba(58,100,255,.05); border-color:var(--brand); box-shadow:0 0 0 2px rgba(58,100,255,.1); border-radius: 12px; }
  .carrier-item.disabled { background: var(--bg); opacity: 0.6; }
  .carrier-item.disabled label { cursor: not-allowed; }
  .carrier-item.disabled span::after { content: " (청구서 없음)"; font-size: 10px; color: var(--muted); display: block; }

  .review-list { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 8px; max-height: 400px; overflow-y: auto; }
  .review-item { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px 16px; align-items: center; padding: 12px; background: var(--card); border-radius: 8px; margin-bottom: 8px; }
  .review-item img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; grid-row: 1 / 3; }
  .review-item .name { font-weight: 600; grid-column: 2 / 4; }
  .review-item .template-label { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  .review-item .fax-label { font-size: 12px; color: var(--muted); margin: 0; align-self: end; }
  .review-item .fax-input { grid-column: 3 / 4; }
  .review-item .fax-input.missing { border-color: #f00; box-shadow: 0 0 0 3px rgba(255,0,0,.2); }

  .signature-pad-wrapper { position:relative; border:2px dashed var(--line); border-radius:12px; margin-top:12px; height: 200px; background: #fff; }
  .signature-pad-wrapper canvas { width:100%; height:100%; border-radius:12px; cursor:crosshair; }
  #clear_signature { position:absolute; top:8px; right:8px; z-index: 10; font-size:12px; padding:6px 10px; }
  .signature-confirm {margin-top:16px;padding:14px;background:var(--bg);border-radius:8px}
  .signature-confirm label {display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer}
  .signature-confirm input[type="checkbox"] {width:auto;flex-shrink:0}
  
  #postcode-layer{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999;width:360px;height:480px;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);background:#fff;overflow:hidden}
  #postcode-layer .layer-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  #postcode-layer .layer-hd strong{font-size:14px}
  #postcode-layer .layer-close{border:0;background:#fff;cursor:pointer;font-size:16px;line-height:1}
  #postcode-layer #postcode-container{width:100%;height:calc(100% - 44px)}

  /* 로딩 오버레이 */
  #loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:99999;align-items:center;justify-content:center}
  #loading-overlay.active{display:flex}
  .loading-content{background:#fff;border-radius:16px;padding:40px 50px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:90%}
  .loading-spinner{width:60px;height:60px;border:5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-content h3{margin:0 0 10px 0;font-size:20px;color:var(--ink);font-weight:800}
  .loading-content p{margin:0;color:var(--muted);font-size:14px}
  #loading-progress{margin-top:12px;font-weight:600;color:var(--brand);font-size:15px}

  @media(max-width:820px){
    .row3, .row2 {grid-template-columns:1fr}
    .seg-phone{grid-template-columns:1fr 14px 1fr 14px 1fr}
    .addr-line{grid-template-columns:100px 1fr}
    .data-actions input {width:100%;order:3}
    .data-actions button {flex:1}
    .step-nav { font-size: 12px; gap: 4px; }
    .step-nav-item { padding: 8px 4px; }
    .carrier-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="wrap">
  <h2>보험금 청구서 자동기입</h2>
  <p class="muted" style="margin:0 0 16px 0">정보 저장/불러오기 가능. 모든 정보는 브라우저 내에서만 처리됩니다.</p>

  <div class="data-actions">
    <label for="passphrase" class="muted" style="margin:0">비밀번호:</label>
    <input id="passphrase" type="password" placeholder="데이터 저장/불러오기용 비밀번호" />
    <button class="btn" id="btnSaveEnc" type="button">내 정보 저장</button>
    <button class="btn" id="btnLoadEnc" type="button">내 정보 불러오기</button>
    <button class="btn" id="btnSample" type="button" style="margin-left:auto">샘플 채우기</button>
  </div>

  <div class="step-nav">
    <div id="step-nav-1" class="step-nav-item active" onclick="navigateToStep(1)">1. 청구자 정보</div>
    <div id="step-nav-2" class="step-nav-item" onclick="navigateToStep(2)">2. 사고/질병 정보</div>
    <div id="step-nav-3" class="step-nav-item" onclick="navigateToStep(3)">3. 보험사 선택</div>
    <div id="step-nav-4" class="step-nav-item" onclick="navigateToStep(4)">4. 검토 및 서명</div>
  </div>

  <div class="card">
    
    <div id="step-1" class="step active">
      <h3>1. 청구자 정보 (누가?)</h3>
      <label style="font-size:16px;font-weight:600;margin:16px 0 12px 0">1-1. 계약자</label>
      <div class="row3">
        <div><label>이름</label><input id="sub_name" placeholder="계약자 이름" /></div>
        <div><label>주민등록번호</label><div class="seg seg-rrn"><input id="sub_rrn1" inputmode="numeric" maxlength="6" placeholder="앞 6자리" /><span class="dash">-</span><input id="sub_rrn2" inputmode="numeric" maxlength="7" placeholder="뒤 7자리" /></div></div>
        <div><label>전화번호</label><div class="seg seg-phone"><input id="sub_phone1" inputmode="numeric" maxlength="3" placeholder="010" /><span class="dash">-</span><input id="sub_phone2" inputmode="numeric" maxlength="4" placeholder="0000" /><span class="dash">-</span><input id="sub_phone3" inputmode="numeric" maxlength="4" placeholder="0000" /></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:24px 0 12px 0">
        <label style="font-size:16px;font-weight:600;margin:0">1-2. 피보험자 (다치거나 아픈 분)</label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0"><input type="checkbox" id="sameSubIns" style="width:auto" /> 계약자와 동일</label>
      </div>
      <div class="row3">
        <div><label>이름</label><input id="ins_name" placeholder="피보험자 이름" /></div>
        <div><label>주민등록번호</label><div class="seg seg-rrn"><input id="ins_rrn1" inputmode="numeric" maxlength="6" placeholder="앞 6자리" /><span class="dash">-</span><input id="ins_rrn2" inputmode="numeric" maxlength="7" placeholder="뒤 7자리" /></div></div>
        <div><label>전화번호</label><div class="seg seg-phone"><input id="ins_phone1" inputmode="numeric" maxlength="3" placeholder="010" /><span class="dash">-</span><input id="ins_phone2" inputmode="numeric" maxlength="4" placeholder="0000" /><span class="dash">-</span><input id="ins_phone3" inputmode="numeric" maxlength="4" placeholder="0000" /></div></div>
      </div>
      
      <div style="margin-top:12px">
        <label>주소</label>
        <div class="addr-line" style="margin-bottom: 8px;">
          <input id="zip" placeholder="우편번호" readonly />
          <input id="addr" placeholder="도로명주소 (클릭하여 검색)" readonly style="cursor: pointer;" />
        </div>
        <div class="addr-line">
          <input id="addr_detail" placeholder="상세주소 (예: 101동 102호, A아파트)" style="grid-column: 1 / -1;" />
        </div>
      </div>
      
      <div class="row2" style="margin-top:12px">
        <div><label>직장/직무</label><input id="employer_job" placeholder="예: 청구닷컴 / 보험상담사" /></div>
        <div id="relationBlock" style="display:none;">
          <label>피보험자와의 관계</label>
          <input id="sub_relation" placeholder="예: 부, 모, 자녀" />
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:24px 0 12px 0">
        <label style="font-size:16px;font-weight:600;margin:0">1-3. 보험금 받는 분 (수익자)</label>
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0"><input type="checkbox" id="sameInsBen" style="width:auto" checked /> 피보험자와 동일</label>
      </div>
      <div id="beneficiaryBlock" style="display:none"><div class="row3"><div><label>이름 (예금주)</label><input id="ben_name" placeholder="수익자 이름" /></div><div><label>은행명</label><input id="bank_name" placeholder="예: 국민은행" /></div><div><label>계좌번호</label><input id="bank_account" placeholder="숫자/하이픈 가능" /></div></div></div>
      <div id="beneficiaryAccountBlock"><div class="row3"><div><label>은행명</label><input id="ins_bank_name" placeholder="수익자 본인 은행" /></div><div><label>계좌번호</label><input id="ins_bank_account" placeholder="수익자 본인 계좌" /></div></div></div>
      <div class="step-footer"><button class="btn" disabled>이전</button><button class="btn primary" type="button" onclick="navigateToStep(2)">다음 (사고/질병 정보)</button></div>
    </div>

    <div id="step-2" class="step">
      <h3>2. 사고/질병 정보 (무엇을?)</h3>
      <div class="row2"><div><label>청구 유형</label><div class="check-group"><label><input type="radio" name="claim_type" id="claim_type_sickness" value="질병" /> 질병</label><label><input type="radio" name="claim_type" id="claim_type_injury" value="상해 (사고)" /> 상해 (사고)</label></div></div><div><label>청구 내용 (중복 가능)</label><div class="check-group"><label><input type="checkbox" name="claim_detail" id="claim_detail_hospital" value="입원" /> 입원</label><label><input type="checkbox" name="claim_detail" id="claim_detail_outpatient" value="통원" /> 통원</label><label><input type="checkbox" name="claim_detail" id="claim_detail_surgery" value="수술" /> 수술</label></div></div></div>
      <div style="margin-top:16px"><label>청구 담보 (항목) - 중복 선택 가능</label><div class="check-group"><label><input type="checkbox" id="claim_item_actual_medical" /> 실손의료비</label><label><input type="checkbox" id="claim_item_daily_allowance" /> 입원일당</label><label><input type="checkbox" id="claim_item_diagnosis" /> 진단비</label><label><input type="checkbox" id="claim_item_surgery" /> 수술비</label><label><input type="checkbox" id="claim_item_disability" /> 후유장해</label><label><input type="checkbox" id="claim_item_death" /> 사망</label><label><input type="checkbox" id="claim_item_other" /> 기타</label></div></div>
      <div class="row2" style="margin-top:16px"><div><label>발병 또는 사고일</label><input type="date" id="accident_date" /></div><div><label>진단명 (병명)</label><input type="text" id="diagnosis" placeholder="예: 급성 위염, 발목 염좌" /></div></div>
      <div class="row2" style="margin-top:16px"><div><label>병원명</label><input type="text" id="hospital_name" placeholder="예: 서울병원" /></div><div><label>사고 경위 (상해/사고일 경우)</label><input type="text" id="accident_detail" placeholder="예: 25년 11월 2일 집 계단에서 넘어짐" /></div></div>
      <div class="step-footer"><button class="btn" type="button" onclick="navigateToStep(1)">이전 (청구자 정보)</button><button class="btn primary" type="button" onclick="navigateToStep(3)">다음 (보험사 선택)</button></div>
    </div>

    <div id="step-3" class="step">
      <h3>3. 보험사 선택</h3>
      <p class="muted" style="margin:-10px 0 12px 0">청구할 보험사를 모두 선택하세요. (청구서가 없는 보험사는 비활성화됩니다)</p>
      
      <h4 class="carrier-type-heading">손해보험사</h4>
      <div id="carrier-grid-sonhae" class="carrier-grid">
        </div>

      <h4 class="carrier-type-heading">생명보험사</h4>
      <div id="carrier-grid-saengmyung" class="carrier-grid">
        </div>

      <div class="step-footer">
        <button class="btn" type="button" onclick="navigateToStep(2)">이전 (사고/질병 정보)</button>
        <button class="btn primary" type="button" onclick="navigateToStep(4)">다음 (검토 및 서명)</button>
      </div>
    </div>

    <div id="step-4" class="step">
      <h3>4. 검토 및 서명</h3>
      <p class="muted" style="margin:-10px 0 12px 0">선택한 보험사의 팩스번호를 확인하세요. (팩스번호 수정 가능)</p>
      
      <div id="review-list-container" class="review-list">
        </div>
      
      <div style="margin-top:12px">
        <label>청구일 (오늘 날짜)</label>
        <input type="date" id="claim_date_today" />
      </div>

      <label style="margin-top:16px;font-weight:600">서명 (청구자)</label>
      <div class="signature-pad-wrapper">
        <canvas id="signature-canvas"></canvas>
        <button class="btn" id="clear_signature" type="button">지우기</button>
      </div>

      <div class="signature-confirm">
        <label>
          <input type="checkbox" id="signature_confirm" />
          <span>본인은 위 청구서 내용과 상기 서명을 확인하였으며, 이는 법적 서명과 동일한 효력을 가짐에 동의합니다. (필수)</span>
        </label>
      </div>

      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="btnDownload" type="button" onclick="handleSubmit('download')" disabled>
          📄 PDF 파일로 저장하기
        </button>
        <button class="btn primary" id="btnSendFax" type="button" onclick="handleSubmit('fax')" disabled>
          📠 선택한 보험사로 팩스 전송
        </button>
      </div>
      <span id="status" class="muted" style="display:block; margin-top: 8px;"></span>
      
      <div class="step-footer">
        <button class="btn" type="button" onclick="navigateToStep(3)">이전 (보험사 선택)</button>
      </div>
    </div>
  </div>
</div>

<div id="postcode-layer" role="dialog" aria-modal="true" aria-label="주소 검색">
  <div class="layer-hd">
    <strong>주소 검색</strong>
    <button class="layer-close" type="button" onclick="closePostcode()" aria-label="닫기">✕</button>
  </div>
  <div id="postcode-container"></div>
</div>

<div id="loading-overlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <h3 id="loading-title">처리 중입니다</h3>
    <p id="loading-message">잠시만 기다려 주세요...</p>

/* ============== 병합된 최종 데이터가 저장될 객체 ============== */
let GLOBAL_MERGED_DATA = {};


/* ============== 공통 유틸 ============== */
const el = id=>document.getElementById(id);
const $status=el(id="status");
let signaturePad = null;

/* ============== 로딩 오버레이 제어 ============== */
function showLoading(title = '처리 중입니다', message = '잠시만 기다려 주세요...', progress = '') {
  const overlay = el('loading-overlay');
  const titleEl = el('loading-title');
  const messageEl = el('loading-message');
  const progressEl = el('loading-progress');
  
  if (titleEl) titleEl.textContent = title;
  if (messageEl) messageEl.textContent = message;
  if (progressEl) progressEl.textContent = progress;
  
  if (overlay) overlay.classList.add('active');
  document.body.style.overflow = 'hidden'; // 스크롤 방지
}

function hideLoading() {
  const overlay = el('loading-overlay');
  if (overlay) overlay.classList.remove('active');
  document.body.style.overflow = ''; // 스크롤 복원
}

function updateLoadingProgress(progress) {
  const progressEl = el('loading-progress');
  if (progressEl) progressEl.textContent = progress;
} 

function onlyDigits(e){ e.value = (e.value||"").replace(/\D/g,""); }
function autoAdvance(cur, nextId, max){ onlyDigits(cur); if(cur.value.length>=max){const n=el(nextId); n&&n.focus(); n?.select?.();} }
function autoBackspace(e, prevId){ if(e.key==="Backspace" && !e.target.value){ const p=el(prevId); p&&p.focus(); p?.select?.(); } }

/* ============== 3단계: 보험사 선택 목록 생성 (손/생 분리) ============== */
function initCarrierList(){
  const containerSonhae = el('carrier-grid-sonhae');
  const containerSaengmyung = el('carrier-grid-saengmyung');
  if (!containerSonhae || !containerSaengmyung) return;
  
  containerSonhae.innerHTML = ""; // 목록 비우기
  containerSaengmyung.innerHTML = ""; // 목록 비우기
  
  for(const [key, config] of Object.entries(GLOBAL_MERGED_DATA)){
    const item = document.createElement('div');
    item.className = 'carrier-item';
    
    const hasTemplate = config.template && config.template.path;
    if (!hasTemplate) {
      item.classList.add('disabled');
    }

    item.innerHTML = `
      <label>
        <input type="checkbox" name="carrier_select" value="${key}" ${!hasTemplate ? 'disabled' : ''}>
        <img src="${config.logo}" alt="${config.name} 로고" onerror="this.onerror=null; this.src='https://placehold.co/140x80/eee/ccc?text=?';">
        <span>${config.name}</span>
      </label>
    `;
    
    if (config.type === "손해") {
      containerSonhae.appendChild(item);
    } else if (config.type === "생명") {
      containerSaengmyung.appendChild(item);
    }
  }
}

/* ============== 4단계: 검토 목록 생성 ============== */
function initReviewList() {
  const container = el('review-list-container');
  container.innerHTML = ""; // 목록 비우기
  
  const selectedCheckboxes = document.querySelectorAll('input[name="carrier_select"]:checked');
  if (selectedCheckboxes.length === 0) {
    container.innerHTML = "<p style='padding:12px;text-align:center;color:var(--muted)'>3단계에서 청구할 보험사를 1곳 이상 선택하세요.</p>";
    return;
  }

  selectedCheckboxes.forEach(cb => {
    const key = cb.value;
    const config = GLOBAL_MERGED_DATA[key];
    if (!config || !config.template) return;

    const faxValue = (config.fax && /^[0-9-]+$/.test(config.fax)) ? config.fax : "";

    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <img src="${config.logo}" alt="${config.name} 로고" onerror="this.onerror=null; this.src='https://placehold.co/32x32/eee/ccc?text=?';">
      <div class="name">${config.name}</div>
      <div class="template-label">청구서: ${config.template.label}</div>
      <label class="fax-label" for="fax_${key}">팩스번호:</label>
      <input type="text" class="fax-input ${!faxValue ? 'missing' : ''}" id="fax_${key}" data-carrier-key="${key}" value="${faxValue || ''}" placeholder="팩스번호 직접 입력">
    `;
    container.appendChild(item);
  });
}

/* ============== 4단계 워크플로우 적용 (NEW) ============== */
let currentStep = 1;
function navigateToStep(stepNumber) {
  if (stepNumber === 4) {
    initReviewList();
  }
  
  if (stepNumber === 3) {
    el('review-list-container').innerHTML = "";
  }
  
  if(currentStep <= 4 && el(`step-${currentStep}`)) el(`step-${currentStep}`).classList.remove('active');
  if(currentStep <= 4 && el(`step-nav-${currentStep}`)) el(`step-nav-${currentStep}`).classList.remove('active');
  currentStep = stepNumber;
  if(el(`step-${currentStep}`)) el(`step-${currentStep}`).classList.add('active');
  if(el(`step-nav-${currentStep}`)) el(`step-nav-${currentStep}`).classList.add('active');

  // (NEW) 4단계에 도달했을 때만 서명패드 초기화
  if (currentStep === 4) {
    el('claim_date_today').value = new Date().toISOString().split('T')[0];

      if (canvas) { // 2. 캔버스가 존재하는지 확인
        try {
          signaturePad = new SignaturePad(canvas, { penColor: "rgb(0, 0, 0)" });
          el('clear_signature').addEventListener('click', () => { 
            if (signaturePad) signaturePad.clear(); 
          });
          window.addEventListener("resize", resizeCanvas); // 리사이즈 이벤트도 여기서 연결
          resizeCanvas(); // 3. 캔버스 크기를 즉시 조절
        } catch(e) {

    }
  }
}

/* ============== (NEW) 만 19세 미만 체크 헬퍼 함수 ============== */
function isMinor(rrn1_str, rrn2_str) {
  if (!rrn1_str || !rrn2_str || rrn1_str.length !== 6 || rrn2_str.length !== 7) {
    return false; // RRN 정보 부족
  }
  try {
    const rrn1 = parseInt(rrn1_str, 10);
    const g = parseInt(rrn2_str.charAt(0), 10); // 7번째 자리

    // 7번째 자리에 따른 세기 결정 (1,2: 1900년대 / 3,4: 2000년대)
    let century = (g === 1 || g === 2 || g === 5 || g === 6) ? 1900 : 2000;
    let birthYear = century + Math.floor(rrn1 / 10000);
    let birthMonth = Math.floor((rrn1 % 10000) / 100) - 1; // JS 월은 0부터 시작
    let birthDay = rrn1 % 100;

    const today = new Date();
    const birthDate = new Date(birthYear, birthMonth, birthDay);
    
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
      age--; // 생일이 아직 안 지났으면 -1
    }
    
    return age < 19; // 만 19세 미만이면 true
  } catch (e) {
    console.error("isMinor RRN 파싱 오류", e);
    return false; // 계산 실패 시 성인으로 간주
  }
}

function applyProfile(p){
  for (const [key, value] of Object.entries(p)) {
    const field = el(key);
    if (!field) continue;
    if (field.type === 'checkbox' || field.type === 'radio') { field.checked = !!value; } else { field.value = value || ""; }
  }

  const sameSubIns = (p.sub_name === p.ins_name) && (p.sub_rrn1 === p.ins_rrn1);
  el('sameSubIns').checked = sameSubIns;

  const sameInsBen = (p.ins_name === p.ben_name) && p.ins_name; // Check if ins_name exists
  el('sameInsBen').checked = sameInsBen;
  
  if (sameInsBen) { 
    el('ins_bank_name').value = p.bank_name || ''; 
    el('ins_bank_account').value = p.bank_account || ''; 
  } else { 
    el('ben_name').value = p.ben_name || '';
    el('bank_name').value = p.bank_name || ''; 
    el('bank_account').value = p.bank_account || ''; 
  }

  if (!sameSubIns) {
    el('sub_relation').value = p.sub_relation || '';
  }
  
  syncSameSubIns(); 
  syncSameInsBen();
}

/* ============== 암호 저장/불러오기 ============== */
async function deriveKey(pass){
  const enc = new TextEncoder(); const salt = enc.encode("claim-autofill-salt-v3");
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:120000, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function encryptJSON(obj, pass){
  const key = await deriveKey(pass); const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
  return { iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) };
}
async function decryptJSON(payload, pass){
  const key = await deriveKey(pass); const iv = new Uint8Array(payload.iv); const cipher = new Uint8Array(payload.cipher);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, cipher);
  return JSON.parse(new TextDecoder().decode(plain));
}
const LS_KEY_SECURE = "claim-autofill.profile.enc.v3";
async function saveEncrypted(){ const pass=el("passphrase").value; if(!pass){alert("암호를 입력하세요.");return;}
  try { const enc=await encryptJSON(collectProfile(),pass); localStorage.setItem(LS_KEY_SECURE,JSON.stringify(enc)); alert("암호 저장 완료"); }
  catch(e) { alert("저장 실패: " + e.message); }
}
async function loadEncrypted(){ const pass=el("passphrase").value; if(!pass){alert("암호를 입력하세요.");return;}
  const raw=localStorage.getItem(LS_KEY_SECURE); if(!raw){alert("저장된 내 정보가 없습니다.");return;}
  try{ const obj=await decryptJSON(JSON.parse(raw),pass); applyProfile(obj); alert("불러오기 완료"); }
  catch(e){ alert("불러오기 실패: 암호를 확인하세요."); } }

function resizeCanvas() {
  const canvas = el('signature-canvas'); // (NEW) 함수 내에서 캔버스 찾기
  if (!canvas || !canvas.getContext) return; 
  const ratio =  Math.max(window.devicePixelRatio || 1, 1);

  canvas.getContext("2d").scale(ratio, ratio);
  if (signaturePad) { signaturePad.clear(); }
}

  // --- (END NEW) ---
}

/* ============== 폰트 로더 ============== */
async function loadKoreanFontBytes(){
  const cdn = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@main/Sans/OTF/Korean/NotoSansKR-Regular.otf';
  const candidates = [ `../assets/fonts/NotoSansKR-Regular.otf`, cdn ];
  for (const url of candidates){
    try{
      const resp = await fetch(url, { cache:'no-store' });
      if (resp.ok){
        const buf = await resp.arrayBuffer();
        if (buf.byteLength > 1024){ console.log('[font] loaded:', url); return buf; }
      } else { console.log('[font] miss(status):', url, resp.status); }
    }catch(e){ console.log('[font] miss(err):', url, e?.message||e); }
  }
  console.warn('[font] no font found -> ASCII fallback');
  return null;
}

/* ============== PDF 생성 핸들러 ============== */
async function handleSubmit(action) {
  const btnDownload = el("btnDownload");
  const btnSendFax = el("btnSendFax");

  // 1. 유효성 검사 (4단계 검토 목록 기준)
  const reviewItems = el('review-list-container').querySelectorAll('.review-item');
  if (reviewItems.length === 0) {
    alert("3단계에서 청구할 보험사를 1곳 이상 선택하세요.");
    navigateToStep(3); 
    el('signature_confirm').checked = false;
    return;
  }
  
  if (!signaturePad || signaturePad.isEmpty()) { // (NEW) signaturePad가 초기화되었는지 확인
    alert("서명란에 서명을 해주세요.");
    navigateToStep(4);
    el('signature_confirm').checked = false;
    return;
  }

  // 로딩 오버레이 표시
  showLoading(
    action === 'download' ? 'PDF 파일 생성 중' : '팩스 전송 중',
    '잠시만 기다려 주세요...',
    '준비 중...'
  );
  
  btnDownload.disabled = true;
  btnSendFax.disabled = true;

  // 2. 작업 목록 (Job List) 생성 및 팩스번호 유효성 검사
  let jobList = [];
  let hasMissingFax = false;
  
  reviewItems.forEach(item => {
    const carrierKey = item.querySelector('.fax-input').dataset.carrierKey;
    const faxInput = item.querySelector('.fax-input');
    const faxNumber = faxInput.value.trim();
    
    if (action === 'fax' && (!faxNumber || !/^[0-9-]+$/.test(faxNumber))) { 
      faxInput.classList.add('missing'); 
      hasMissingFax = true;
    } else {
      faxInput.classList.remove('missing');
    }
    
    jobList.push({
      carrierKey: carrierKey,
      faxNumber: faxNumber
    });
  });

  if (hasMissingFax) {
    hideLoading();
    alert("팩스번호가 비어있거나 형식이 잘못된 항목이 있습니다. (숫자와 하이픈만 사용)\n팩스번호를 입력하거나, 'PDF 파일로 저장하기'를 이용하세요.");
    el('signature_confirm').checked = false; 
    btnDownload.disabled = false;
    btnSendFax.disabled = false;
    return;
  }

  const P = collectProfile();
  if(!P?.ins_name){ hideLoading(); alert("피보험자 이름을 입력하세요."); navigateToStep(1); btnDownload.disabled = false; btnSendFax.disabled = false; return; }
  if(!P?.accident_date){ hideLoading(); alert("발병/사고일을 입력하세요."); navigateToStep(2); btnDownload.disabled = false; btnSendFax.disabled = false; return; }

  const { PDFDocument, StandardFonts } = PDFLib;
  let kFontBytes = null, sigImageBytes = null;
  
  try {
    // 3. 공통 리소스 로드
    updateLoadingProgress('폰트 및 서명 이미지 로드 중...');
    kFontBytes = await loadKoreanFontBytes();
    const sigDataUrl = signaturePad.toDataURL("image/png");
    sigImageBytes = await fetch(sigDataUrl).then(res => res.arrayBuffer());

    // 4. 액션에 따라 분기
    if (action === 'download') {
      // --- 4-A: PDF 저장하기 (ZIP 로직) ---
      if (jobList.length > 1) {
        updateLoadingProgress(`ZIP 파일 생성 중... (0/${jobList.length})`);
        const zip = new JSZip();
        for (let i = 0; i < jobList.length; i++) {
          const job = jobList[i];
          const config = GLOBAL_MERGED_DATA[job.carrierKey];
          updateLoadingProgress(`${config.name} 생성 중... (${i+1}/${jobList.length})`);
          
          const pdfBytes = await generateSinglePdf(P, config.template, kFontBytes, sigImageBytes);
          zip.file(`${config.name}_보험금청구서.pdf`, pdfBytes);
        }
        updateLoadingProgress("ZIP 파일 압축 중...");
        const zipBlob = await zip.generateAsync({ type: "blob" });
        downloadFile(zipBlob, "insurance_claims.zip");
        hideLoading();
        alert("✅ ZIP 파일 생성 완료!");
      } else {
        updateLoadingProgress("PDF 파일 생성 중...");
        const job = jobList[0];
        const config = GLOBAL_MERGED_DATA[job.carrierKey];
        const pdfBytes = await generateSinglePdf(P, config.template, kFontBytes, sigImageBytes);
        downloadFile(new Blob([pdfBytes], { type:"application/pdf" }), `${config.name}_보험금청구서.pdf`);
        hideLoading();
        alert("✅ PDF 파일 생성 완료!");
      }

    } else if (action === 'fax') {
      // --- 4-B: 팩스 전송하기 (시뮬레이션) ---
      let faxLog = [];

      for (let i = 0; i < jobList.length; i++) {
        const job = jobList[i];
        const config = GLOBAL_MERGED_DATA[job.carrierKey];
        updateLoadingProgress(`${config.name} 전송 중... (${i+1}/${jobList.length})`);
        
        try {
          const pdfBytes = await generateSinglePdf(P, config.template, kFontBytes, sigImageBytes);
          await new Promise(resolve => setTimeout(resolve, 1000)); 
          
          console.log(`[MOCK FAX] ${config.name}(${job.faxNumber})로 ${config.template.label} PDF (${(pdfBytes.length/1024).toFixed(1)}KB) 전송 성공.`);
          faxLog.push(`✅ ${config.name}: 전송 성공 (-> ${job.faxNumber})`);

        } catch (e) {
          console.error(`팩스 전송 실패: ${config.name}`, e);
          faxLog.push(`❌ ${config.name}: 생성/전송 실패 (${e.message})`);
        }
      }
      hideLoading();
      alert("팩스 전송이 완료되었습니다. (시뮬레이션)\n\n--- 전송 결과 ---\n" + faxLog.join("\n"));
    }

  } catch (err) {
    console.error(err);
    hideLoading();
    alert("작업 실패: " + (err.message||err));
  } finally {
    // 5. (공통) 작업 완료 후 상태 원복
    el('signature_confirm').checked = false;
    btnDownload.disabled = true;
    btnSendFax.disabled = true;
    if (signaturePad) signaturePad.clear();
  }
}

/* ============== (NEW) 개별 PDF 생성 로직 - AcroForm 방식 ============== */
async function generateSinglePdf(P, templateConfig, kFontBytes, sigImageBytes) {
  const { PDFDocument, StandardFonts } = PDFLib;
  if (!templateConfig || !templateConfig.path) {
    throw new Error("PDF 템플릿 경로(path)가 설정되지 않았습니다.");
  }
  
  const url = new URL(encodeURI(templateConfig.path), location.origin).toString();
  
  let existingPdfBytes;
  try {
     existingPdfBytes = await fetch(url, { cache:"no-store" }).then(res => {
      if(!res.ok) throw new Error(`PDF 템플릿 로드 실패: ${res.status} ${res.statusText} (경로: ${url})`);
      return res.arrayBuffer();
     });
  } catch (e) {
    console.error(e);
    throw new Error(`PDF 템플릿(${url})을 불러올 수 없습니다. 파일 경로를 확인하세요.`);
  }

  const pdfDoc = await PDFDocument.load(existingPdfBytes, { ignoreEncryption:true });
  if (typeof fontkit !== "undefined") pdfDoc.registerFontkit(fontkit);

  let fontToUse;
  if (kFontBytes) { fontToUse = await pdfDoc.embedFont(kFontBytes, { subset:true }); } 
  else { fontToUse = await pdfDoc.embedFont(StandardFonts.Helvetica); }
  
  // AcroForm 방식
  const form = pdfDoc.getForm();
  for (const [fieldName, text] of Object.entries(P)) {
    if (text === "" || text === false || text === undefined) continue;
    try {
      if (typeof text === 'string') {
        const field = form.getTextField(fieldName);
        field.disableRichFormatting();
        field.setText(text);
        field.updateAppearances(fontToUse);
      } else if (typeof text === 'boolean' && text === true) {
        const field = form.getRadioGroup(fieldName) || form.getCheckBox(fieldName);
        if(field.constructor.name === 'PDFRadioGroup') {
            const options = field.getOptions();
            if(options.length > 0) field.select(options[0]);
        } else { field.check(); }
        field.updateAppearances();
      }
    } catch (e) { /* 필드 없음 */ }
  }
  
  // 서명 추가
  if (sigImageBytes && templateConfig.sigPositions && templateConfig.sigPositions.length > 0) {
    const sigImage = await pdfDoc.embedPng(sigImageBytes);
    const isInsuredMinor = P.isMinor;

    for (const pos of templateConfig.sigPositions) {
      let shouldStamp = false;

      if (pos.type === 'BENEFICIARY') {
        shouldStamp = true;
      }
      else if (pos.type === 'INSURED' && !isInsuredMinor) {
        shouldStamp = true;
      }
      else if (pos.type === 'GUARDIAN' && isInsuredMinor) {
        shouldStamp = true;
      }
      else if (!pos.type) {
        shouldStamp = true;
      }

      if (shouldStamp) {
        if (pos.page >= 0 && pos.page < pdfDoc.getPageCount()) {
          const page = pdfDoc.getPage(pos.page);
          const { x, y, width, height } = pos;
          page.drawImage(sigImage, { x, y, width, height });
        } else {
          console.warn(`잘못된 페이지 번호(${pos.page})로 서명을 건너뜁니다.`);
        }
      }
    }
  }
  
  // 어메이징사업부 브랜딩을 PDF 속성(문서 정보)에 은은하게 심는다.
  // 서류 지면에는 전혀 표시되지 않고, 파일 속성에만 남는다.
  try {
    pdfDoc.setAuthor("프라임에셋 어메이징사업부");
    pdfDoc.setCreator("청구닷컴(청구.com) · 프라임에셋 어메이징사업부");
    pdfDoc.setProducer("청구닷컴 · 프라임에셋 어메이징사업부");
  } catch (e) { /* 메타데이터 설정 실패는 무시 */ }

  form.flatten();
  return await pdfDoc.save();
}

/* ============== 파일 다운로드 헬퍼 ============== */
function downloadFile(blob, fileName) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(a.href);
}
