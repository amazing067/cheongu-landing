    // 전역 변수
    let filteredHospitals = [...hospitals];
    let selectedRegion = '';

    // DOM 요소
    const searchInput = document.getElementById('searchInput');
    const regionSelect = document.getElementById('regionSelect');
    const hospitalCount = document.getElementById('hospitalCount');
    const hospitalList = document.getElementById('hospitalList');
    const statsContainer = document.getElementById('statsContainer');

    // 초기화
    function init() {
      populateRegionSelect();
      renderHospitalList(hospitals);
      renderStats();
      attachEventListeners();
    }

    // 지역 선택 옵션 생성
    function populateRegionSelect() {
      const regions = [...new Set(hospitals.map(h => h.region))].sort();
      regions.forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        regionSelect.appendChild(option);
      });
    }

    // 병원 목록 렌더링
    function renderHospitalList(hospitalData) {
      hospitalList.innerHTML = '';
      hospitalData.forEach(hospital => {
        const item = document.createElement('div');
        item.className = 'hospital-item';
        item.innerHTML = `
          <div class="hospital-name">${hospital.name}</div>
          <div class="hospital-info">
            <div>
              <span class="hospital-region">${hospital.region}</span>
              <span>${hospital.city}</span>
            </div>
            <div>📍 ${hospital.address}</div>
            <div>📞 ${hospital.tel}</div>
            ${hospital.beds ? `<div>🏥 병상수: ${hospital.beds}개</div>` : ''}
          </div>
          <div class="hospital-actions">
            <a href="tel:${hospital.tel.replace(/[^0-9]/g, '')}" class="action-btn btn-call">📞 전화</a>
            <a href="https://map.naver.com/p/search/${encodeURIComponent(hospital.name + ' ' + hospital.address)}" 
               target="_blank" class="action-btn btn-map">🗺️ 지도</a>
            <button onclick="copyAddress('${hospital.address}')" class="action-btn btn-copy">📋 주소복사</button>
            ${hospital.homepage ? 
              `<a href="${hospital.homepage}" target="_blank" class="action-btn btn-web">🌐 홈페이지</a>` : ''}
          </div>
        `;
        hospitalList.appendChild(item);
      });
      hospitalCount.textContent = hospitalData.length;
    }

    // 지역별 통계 렌더링
    function renderStats() {
      const stats = {};
      hospitals.forEach(h => {
        if (!stats[h.region]) {
          stats[h.region] = 0;
        }
        stats[h.region]++;
      });

      statsContainer.innerHTML = '';
      Object.entries(stats).sort((a, b) => b[1] - a[1]).forEach(([region, count]) => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.dataset.region = region;
        card.innerHTML = `
          <div class="stat-region">${region}</div>
          <div class="stat-count">${count}</div>
        `;
        card.addEventListener('click', () => filterByRegion(region));
        statsContainer.appendChild(card);
      });
    }

    // 필터링 함수
    function filterHospitals() {
      const searchTerm = searchInput.value.toLowerCase();
      const selectedRegion = regionSelect.value;

      filteredHospitals = hospitals.filter(h => {
        const matchSearch = !searchTerm || 
          h.name.toLowerCase().includes(searchTerm) ||
          h.address.toLowerCase().includes(searchTerm) ||
          h.city.toLowerCase().includes(searchTerm);
        
        const matchRegion = !selectedRegion || h.region === selectedRegion;
        
        return matchSearch && matchRegion;
      });

      renderHospitalList(filteredHospitals);
    }

    // 지역 필터링
    function filterByRegion(region) {
      if (regionSelect.value === region) {
        regionSelect.value = '';
      } else {
        regionSelect.value = region;
      }
      filterHospitals();
      
      // 지도 하이라이트
      document.querySelectorAll('.region-group').forEach(g => {
        if (g.dataset.region === region && regionSelect.value === region) {
          g.querySelector('circle').style.strokeWidth = '5';
          g.querySelector('circle').style.stroke = '#333';
        } else {
          g.querySelector('circle').style.strokeWidth = '0';
        }
      });
    }

    // 주소 복사
    function copyAddress(address) {
      navigator.clipboard.writeText(address).then(() => {
        alert('주소가 클립보드에 복사되었습니다.');
      }).catch(() => {
        alert('주소 복사에 실패했습니다.');
      });
    }

    // 이벤트 리스너 연결
    function attachEventListeners() {
      searchInput.addEventListener('input', filterHospitals);
      regionSelect.addEventListener('change', filterHospitals);
      
      // 지도 클릭 이벤트
      document.querySelectorAll('.region-group').forEach(group => {
        group.addEventListener('click', () => {
          filterByRegion(group.dataset.region);
        });
      });
    }

    // 페이지 로드 시 초기화
    init();
  </script>
